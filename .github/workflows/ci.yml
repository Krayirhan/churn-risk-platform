# ============================================================================
# ci.yml — Continuous Integration Pipeline (GitHub Actions)
# ============================================================================
# NEDEN BU WORKFLOW?
#   Her push ve pull request'te otomatik:
#     1. Lint (flake8) → Kod kalitesi kontrolü
#     2. Test (pytest) → 98+ testin tamamının geçmesi
#     3. Coverage → Test kapsam raporu
#     4. Docker Build → Image'ın başarıyla build olması
#
# TETİKLENME:
#   - push   → main, develop branch'ları
#   - PR     → main branch'a açılan PR'lar
#   - manual → workflow_dispatch ile elle tetikleme
# ============================================================================

name: CI — Lint, Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Aynı branch'ta birden fazla CI çalışırsa eskisini iptal et
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  DOCKER_IMAGE: churn-risk-platform

jobs:

  # ──────────────────────────────────────────────────────────
  # JOB 1: Lint — Kod kalitesi kontrolü
  # ──────────────────────────────────────────────────────────
  lint:
    name: 🧹 Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: flake8 kurulumu ve çalıştırma
        run: |
          pip install flake8
          # E501: satır uzunluğu (120 karakter tolerans)
          # W503: line break before binary operator (PEP8 değişti)
          # E203: whitespace before ':' (black uyumlu)
          flake8 src/ app.py main.py \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E203,W291,W293,W391 \
            --statistics \
            --count

  # ──────────────────────────────────────────────────────────
  # JOB 2: Test — pytest + coverage
  # ──────────────────────────────────────────────────────────
  test:
    name: 🧪 Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Bağımlılık kurulumu
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Pytest çalıştır (coverage ile)
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
          retention-days: 30

  # ──────────────────────────────────────────────────────────
  # JOB 3: C# Build — .NET backend doğrulaması
  # ──────────────────────────────────────────────────────────
  csharp-build:
    name: 🔷 C# Build (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore & Build
        working-directory: backend-csharp
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

  # ──────────────────────────────────────────────────────────
  # JOB 4: Frontend Smoke — Statik dosya doğrulaması
  # ──────────────────────────────────────────────────────────
  frontend-check:
    name: 🌐 Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HTML/JS dosya varlığı kontrolü
        run: |
          echo "📁 Frontend dosya kontrolü..."
          test -f frontend-dashboard/index.html  || { echo "❌ index.html yok"; exit 1; }
          test -f frontend-dashboard/js/app.js   || { echo "❌ app.js yok"; exit 1; }
          test -f frontend-dashboard/css/style.css || { echo "❌ style.css yok"; exit 1; }
          echo "✅ Frontend dosyaları mevcut"

      - name: JavaScript syntax kontrolü (Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS parse check
        run: |
          node --check frontend-dashboard/js/app.js
          echo "✅ JavaScript syntax geçerli"

  # ──────────────────────────────────────────────────────────
  # JOB 5: Docker Build — Image doğrulaması
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [test, csharp-build, frontend-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx kurulumu
        uses: docker/setup-buildx-action@v3

      - name: Docker image build (cache ile)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image boyutunu kontrol et
        run: |
          docker images ${{ env.DOCKER_IMAGE }}:ci-${{ github.sha }}
          echo "---"
          # Image 1GB'dan büyükse uyar
          SIZE=$(docker images ${{ env.DOCKER_IMAGE }}:ci-${{ github.sha }} --format "{{.Size}}")
          echo "📦 Image size: $SIZE"

      - name: Container smoke test
        run: |
          # Container'ı arka planda başlat
          docker run -d --name smoke-test \
            -p 8000:8000 \
            ${{ env.DOCKER_IMAGE }}:ci-${{ github.sha }}

          # Sunucunun ayağa kalkmasını bekle
          echo "⏳ Sunucu başlatılıyor..."
          sleep 10

          # Health endpoint kontrolü (JSON status kontrolü)
          HEALTH_STATUS=$(curl -s http://localhost:8000/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unreachable")
          echo "🏥 Health check status: $HEALTH_STATUS"

          # Temizle
          docker stop smoke-test && docker rm smoke-test

          # healthy veya degraded kabul edilir (model yoksa degraded)
          if [ "$HEALTH_STATUS" = "healthy" ] || [ "$HEALTH_STATUS" = "degraded" ]; then
            echo "✅ Smoke test passed"
          else
            echo "❌ Smoke test failed (status: $HEALTH_STATUS)"
            exit 1
          fi
