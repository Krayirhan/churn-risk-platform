services:
  # Python ML Backend
  python-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-python-backend
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - API_KEY=${API_KEY:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - WORKERS=${WORKERS:-2}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, json; r=urllib.request.urlopen('http://localhost:8000/health'); d=json.loads(r.read()); exit(0 if d.get('status')=='healthy' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - churn-network

  # C# API Gateway
  csharp-backend:
    build:
      context: .
      dockerfile: Dockerfile.csharp
    container_name: churn-csharp-backend
    ports:
      - "5001:5001"
    depends_on:
      python-backend:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - PythonAPI__BaseUrl=http://python-backend:8000
      - PythonAPI__ApiKey=${API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/churn/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - churn-network

  # Frontend Dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: churn-frontend
    ports:
      - "5500:5500"
    depends_on:
      - csharp-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5500/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - churn-network

networks:
  churn-network:
    driver: bridge
