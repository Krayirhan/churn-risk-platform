# ============================================================================
# model_params.yaml — Model Hiperparametre Tanımları
# ============================================================================
# NEDEN BU DOSYA VAR?
#   Model seçimi ve hiperparametre tuning'i bu YAML'dan okunur.
#   model_trainer.py bu dosyayı okuyup GridSearchCV ile en iyi
#   kombinasyonu bulur. Yeni model denemek istediğinde sadece buraya ekle.
#
# CHURN PROBLEMİNDE ÖNEMLİ NOKTALAR:
#   - Veri dengesiz (imbalanced): ~73% No Churn, ~27% Yes Churn
#   - Bu yüzden class_weight="balanced" veya scale_pos_weight kullanıyoruz
#   - Metrik olarak Accuracy DEĞİL, F1-score / Recall kullanıyoruz
#   - Recall yüksek olmalı: churn eden müşteriyi kaçırmak maliyetli!
# ============================================================================

models:

  # --- LOJİSTİK REGRESYON ---
  # Baseline. Tek parametre kombinasyonu → hızlı.
  LogisticRegression:
    C: [0.1]                           # Önceki en iyi değer
    penalty: ["l2"]
    solver: ["lbfgs"]
    max_iter: [1000]
    class_weight: ["balanced"]

  # --- RANDOM FOREST ---
  # Tek kombinasyon → hızlı benchmark.
  RandomForestClassifier:
    n_estimators: [300]                # Önceki en iyi değer
    max_depth: [null]                  # Sınırsız derinlik
    min_samples_split: [5]             # Önceki en iyi değer
    class_weight: ["balanced"]
    random_state: [42]

  # --- XGBOOST ---
  # Önceki en iyi params. Optuna daha ince arama yapacak.
  XGBClassifier:
    learning_rate: [0.05]              # Önceki en iyi değer
    max_depth: [7]                     # Önceki en iyi değer
    n_estimators: [300]                # Önceki en iyi değer
    subsample: [0.8]
    colsample_bytree: [0.8]
    scale_pos_weight: [3.0]
    eval_metric: ["logloss"]
    random_state: [42]

  # --- GRADIENT BOOSTING (sklearn) ---
  # Tek kombinasyon.
  GradientBoostingClassifier:
    n_estimators: [300]
    learning_rate: [0.05]
    max_depth: [5]
    subsample: [0.8]
    random_state: [42]

  # --- LIGHTGBM ---
  # Önceki en iyi params. 1 kombinasyon → ~30 saniye.
  LGBMClassifier:
    learning_rate: [0.01]              # Önceki en iyi değer
    max_depth: [9]                     # Önceki en iyi değer
    n_estimators: [400]                # Önceki en iyi değer
    num_leaves: [127]                  # Önceki en iyi değer
    subsample: [0.8]
    colsample_bytree: [0.8]
    min_child_samples: [20]
    class_weight: ["balanced"]
    random_state: [42]

  # --- CATBOOST ---
  # Önceki en iyi params. 1 kombinasyon → ~1-2 dakika.
  CatBoostClassifier:
    learning_rate: [0.05]              # Önceki en iyi değer
    depth: [6]                         # Önceki en iyi değer
    iterations: [300]                  # Yeterli round
    l2_leaf_reg: [3]                   # Hafif regularization
    auto_class_weights: ["Balanced"]
    random_seed: [42]
